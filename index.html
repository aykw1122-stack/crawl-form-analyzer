<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Crawl Form Analyzer v1.5</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    :root{--panel:#0d1b2a;--panel2:#10243a;--text:#f5f7fb;--muted:#9fb1c7}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);background:linear-gradient(180deg,#07111f,#091827 55%,#07111f);min-height:100vh}
    .wrap{max-width:900px;margin:auto;padding:14px}
    h1{font-size:clamp(22px,5vw,34px);margin:6px 0 4px}
    .sub{color:var(--muted);font-size:14px;margin-bottom:12px}
    .card{background:rgba(13,27,42,.94);border:1px solid #20354d;border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 12px 30px #0005}
    .stage{position:relative;overflow:hidden;border-radius:14px;background:#000;aspect-ratio:3/4;max-height:68vh}
    video,canvas.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    video{transform:scaleX(-1)}
    canvas.overlay{pointer-events:none}
    .status{position:absolute;top:10px;left:10px;right:10px;padding:8px 10px;border-radius:12px;background:#000c;font-size:13px;white-space:pre-wrap}
    .status.ok{background:#0a3f34dd}.status.err{background:#5a1622e8}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    .metric{background:var(--panel2);border-radius:14px;padding:12px;text-align:center}
    .metric .label{color:var(--muted);font-size:13px}
    .metric .value{font-size:31px;font-weight:800;line-height:1.15;margin-top:4px}
    .metric .quality{font-size:12px;margin-top:5px;color:var(--muted)}
    .buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
    button{appearance:none;border:none;border-radius:14px;padding:13px 11px;font-weight:800;font-size:15px;background:#1e88e5;color:#fff;min-height:48px}
    button.secondary{background:#24384d}button.record{background:#d6455d}button.stop{background:#7a3342}button:disabled{opacity:.42}
    select{width:100%;background:#132840;color:#fff;border:1px solid #29445f;border-radius:12px;padding:12px;font-size:15px}
    .notice{padding:9px 11px;border-radius:12px;background:#182d43;color:#d9e7f5;font-size:13px;margin-top:10px}
    .graphWrap{height:240px;background:#081522;border-radius:14px;overflow:hidden}
    canvas#graph{width:100%;height:100%}
    .row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
    .pill{background:#142a42;padding:6px 10px;border-radius:999px;color:#cfe9ff;font-size:12px}
    .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:8px}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.dot.r{background:#46b5ff}.dot.l{background:#38d39f}
    .diag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:#c6d4e3;white-space:pre-wrap;word-break:break-word;background:#071522;border-radius:12px;padding:10px;max-height:190px;overflow:auto}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
    .statsBox{background:#0a1826;border-radius:14px;padding:12px}
    .statsBox h3{margin:0 0 8px;font-size:16px}
    .statline{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #1a3047;font-size:13px}
    .statline:last-child{border-bottom:none}
    .statline b{font-size:15px}
    .summary{margin-top:10px;background:#132840;border-radius:14px;padding:12px}
    .summaryTitle{font-weight:800;margin-bottom:6px}
    .summaryText{color:#d7e4f2;font-size:13px;line-height:1.6}
  </style>
</head>
<body>
<div class="wrap">
  <h1>🏊 Crawl Form Analyzer</h1>
  <div class="sub">v1.5 — 片腕単独解析・自動判定対応</div>

  <section class="card">
    <label for="modeSelect"><strong>解析モード</strong></label>
    <select id="modeSelect">
      <option value="auto">自動判定</option>
      <option value="right">右腕のみ</option>
      <option value="left">左腕のみ</option>
    </select>
    <div class="notice" id="modeHint">自動判定では、記録中により安定して見えている腕を優先します。</div>
  </section>

  <section class="card">
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay" class="overlay"></canvas>
      <div class="status" id="status">起動中…</div>
    </div>

    <div class="grid">
      <div class="metric"><div class="label">右ひじ</div><div class="value" id="rightAngle">--°</div><div class="quality" id="rightQuality">未検出</div></div>
      <div class="metric"><div class="label">左ひじ</div><div class="value" id="leftAngle">--°</div><div class="quality" id="leftQuality">未検出</div></div>
    </div>

    <div class="buttons">
      <button id="cameraBtn" disabled>📷 カメラ開始</button>
      <button id="flipBtn" class="secondary" disabled>🔄 カメラ切替</button>
      <button id="recordBtn" class="record" disabled>● 記録開始</button>
      <button id="stopBtn" class="stop" disabled>■ 記録停止</button>
    </div>

    <div class="notice" id="hint">MediaPipe Poseを確認しています…</div>
  </section>

  <section class="card">
    <div class="row"><strong>肘角度の記録</strong><span class="pill" id="sampleCount">0 サンプル</span></div>
    <div class="graphWrap"><canvas id="graph"></canvas></div>
    <div class="legend"><span><i class="dot r"></i>右肘</span><span><i class="dot l"></i>左肘</span></div>
    <div class="buttons"><button id="csvBtn" class="secondary" disabled>CSV保存</button><button id="clearBtn" class="secondary">記録クリア</button></div>
  </section>

  <section class="card">
    <div class="row">
      <strong>記録結果</strong>
      <span class="pill" id="durationPill">0.0 秒</span>
    </div>

    <div class="stats">
      <div class="statsBox">
        <h3>右ひじ</h3>
        <div class="statline"><span>最小</span><b id="rMin">--°</b></div>
        <div class="statline"><span>最大</span><b id="rMax">--°</b></div>
        <div class="statline"><span>平均</span><b id="rAvg">--°</b></div>
        <div class="statline"><span>可動幅</span><b id="rRange">--°</b></div>
      </div>
      <div class="statsBox">
        <h3>左ひじ</h3>
        <div class="statline"><span>最小</span><b id="lMin">--°</b></div>
        <div class="statline"><span>最大</span><b id="lMax">--°</b></div>
        <div class="statline"><span>平均</span><b id="lAvg">--°</b></div>
        <div class="statline"><span>可動幅</span><b id="lRange">--°</b></div>
      </div>
    </div>

    <div class="summary">
      <div class="summaryTitle">解析結果</div>
      <div class="summaryText" id="summaryText">記録停止後に自動計算します。</div>
    </div>
  </section>

  <section class="card">
    <strong>診断ログ</strong>
    <div id="diag" class="diag">ページ読み込み完了</div>
  </section>
</div>

<script>
(async function(){
  const $=id=>document.getElementById(id);
  const video=$("video"), overlay=$("overlay"), ctx=overlay.getContext("2d");
  const statusEl=$("status"), diagEl=$("diag"), hint=$("hint");
  const rightAngleEl=$("rightAngle"), leftAngleEl=$("leftAngle");
  const rightQualityEl=$("rightQuality"), leftQualityEl=$("leftQuality");
  const cameraBtn=$("cameraBtn"), flipBtn=$("flipBtn"), recordBtn=$("recordBtn"), stopBtn=$("stopBtn");
  const csvBtn=$("csvBtn"), clearBtn=$("clearBtn"), sampleCountEl=$("sampleCount");
  const graph=$("graph"), gctx=graph.getContext("2d");
  const durationPill=$("durationPill"), summaryText=$("summaryText"), modeSelect=$("modeSelect"), modeHint=$("modeHint");
  const rMin=$("rMin"),rMax=$("rMax"),rAvg=$("rAvg"),rRange=$("rRange");
  const lMin=$("lMin"),lMax=$("lMax"),lAvg=$("lAvg"),lRange=$("lRange");

  let pose=null, stream=null, facingMode="user", running=false, processing=false;
  let recording=false, recordStart=0, samples=[], rafId=null;
  let rightValidCount=0,leftValidCount=0;

  function log(msg){
    diagEl.textContent += "\n[" + new Date().toLocaleTimeString() + "] " + msg;
    diagEl.scrollTop = diagEl.scrollHeight;
  }
  function setStatus(text,kind=""){
    statusEl.textContent=text;
    statusEl.className="status"+(kind?" "+kind:"");
    log(text);
  }
  function fail(stage,err){
    setStatus(stage+"でエラー\n"+(err?.message||String(err)||"不明なエラー"),"err");
    hint.textContent="赤いエラー表示と診断ログをスクリーンショットで送ってください。";
  }

  modeSelect.onchange=()=>{
    const v=modeSelect.value;
    modeHint.textContent=v==="auto"?"自動判定では、記録中により安定して見えている腕を優先します。":
      v==="right"?"右腕だけで解析します。左腕の未検出は無視します。":
      "左腕だけで解析します。右腕の未検出は無視します。";
  };

  addEventListener("error",e=>log("window error: "+(e.message||"unknown")));
  addEventListener("unhandledrejection",e=>log("unhandled rejection: "+(e.reason?.message||e.reason||"unknown")));

  try{
    setStatus("1/3 MediaPipe Poseライブラリ確認中…");
    if(typeof Pose==="undefined") throw new Error("Pose が見つかりません。pose.js の読み込みに失敗しています。");
    if(typeof drawConnectors==="undefined" || typeof drawLandmarks==="undefined") throw new Error("drawing_utils.js の読み込みに失敗しています。");
    log("Pose / drawing_utils 読み込み OK");

    setStatus("2/3 Poseエンジン初期化中…");
    pose=new Pose({ locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
    pose.setOptions({
      modelComplexity:1,
      smoothLandmarks:true,
      enableSegmentation:false,
      smoothSegmentation:false,
      minDetectionConfidence:0.5,
      minTrackingConfidence:0.5,
      selfieMode:false
    });
    pose.onResults(onResults);

    setStatus("3/3 AI準備完了","ok");
    cameraBtn.disabled=false;
    hint.textContent="「カメラ開始」を押して、カメラ使用を許可してください。";
  }catch(err){
    fail("AI初期化",err);
  }

  function angle3(a,b,c){
    const bax=a.x-b.x,bay=a.y-b.y,bcx=c.x-b.x,bcy=c.y-b.y;
    const dot=bax*bcx+bay*bcy,mag=Math.hypot(bax,bay)*Math.hypot(bcx,bcy);
    if(!mag)return null;
    return Math.acos(Math.max(-1,Math.min(1,dot/mag)))*180/Math.PI;
  }

  function visibilityOk(...pts){ return pts.every(p=>p && (p.visibility??1)>.55); }
  function qualityText(ok,pts){
    if(!ok)return "検出が不安定";
    const q=Math.min(...pts.map(p=>p.visibility??1));
    return q>.85?"追跡 良好":q>.65?"追跡 普通":"追跡 弱め";
  }

  function resizeCanvas(){
    if(video.videoWidth&&video.videoHeight&&(overlay.width!==video.videoWidth||overlay.height!==video.videoHeight)){
      overlay.width=video.videoWidth; overlay.height=video.videoHeight;
    }
  }

  function onResults(results){
    processing=false;
    resizeCanvas();
    ctx.clearRect(0,0,overlay.width,overlay.height);

    const lm=results.poseLandmarks;
    if(!lm){
      rightAngleEl.textContent=leftAngleEl.textContent="--°";
      rightQualityEl.textContent=leftQualityEl.textContent="未検出";
      statusEl.textContent="全身を画面に入れてください";
      statusEl.className="status";
      return;
    }

    ctx.save();
    if(facingMode==="user"){ctx.translate(overlay.width,0);ctx.scale(-1,1)}
    drawConnectors(ctx,lm,POSE_CONNECTIONS,{color:"#46b5ff",lineWidth:4});
    drawLandmarks(ctx,lm,{color:"#ffffff",fillColor:"#38d39f",lineWidth:2,radius:4});
    ctx.restore();

    const ls=lm[11],rs=lm[12],le=lm[13],re=lm[14],lw=lm[15],rw=lm[16];
    const rOk=visibilityOk(rs,re,rw), lOk=visibilityOk(ls,le,lw);
    const r=rOk?angle3(rs,re,rw):null, l=lOk?angle3(ls,le,lw):null;

    rightAngleEl.textContent=r==null?"--°":Math.round(r)+"°";
    leftAngleEl.textContent=l==null?"--°":Math.round(l)+"°";
    rightQualityEl.textContent=qualityText(rOk,[rs,re,rw]);
    leftQualityEl.textContent=qualityText(lOk,[ls,le,lw]);

    statusEl.textContent=recording?"● 記録中":"人体を追跡中";
    statusEl.className="status ok";

    if(recording){
      if(r!=null)rightValidCount++;
      if(l!=null)leftValidCount++;
      if(r!=null||l!=null){
        samples.push({t:(performance.now()-recordStart)/1000,right:r,left:l});
        sampleCountEl.textContent=samples.length+" サンプル";
        durationPill.textContent=(samples[samples.length-1].t||0).toFixed(1)+" 秒";
        if(samples.length%4===0)drawGraph();
      }
    }
  }

  async function predictionLoop(){
    if(!running)return;
    if(video.readyState>=2 && !processing && pose){
      processing=true;
      try{ await pose.send({image:video}); }
      catch(err){ processing=false; fail("姿勢推定",err); running=false; return; }
    }
    rafId=requestAnimationFrame(predictionLoop);
  }

  async function startCamera(){
    if(!navigator.mediaDevices?.getUserMedia){
      fail("カメラ",new Error("getUserMedia が利用できません。ChromeでHTTPS URLから開いてください。"));
      return;
    }
    if(stream)stream.getTracks().forEach(t=>t.stop());
    try{
      setStatus("カメラ起動中…");
      stream=await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{facingMode:{ideal:facingMode},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:60}}
      });
      video.srcObject=stream;
      await video.play();
      running=true;
      flipBtn.disabled=false;
      recordBtn.disabled=false;
      cameraBtn.textContent="📷 カメラ再起動";
      setStatus("カメラ起動完了","ok");
      if(rafId)cancelAnimationFrame(rafId);
      predictionLoop();
    }catch(err){ fail("カメラ起動",err); }
  }

  function mean(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null; }
  function statsFor(key){
    const vals=samples.map(s=>s[key]).filter(v=>Number.isFinite(v));
    if(!vals.length)return null;
    const min=Math.min(...vals),max=Math.max(...vals),avg=mean(vals);
    return {min,max,avg,range:max-min,count:vals.length};
  }
  function deg(v){ return v==null?"--°":Math.round(v)+"°"; }

  function renderStats(){
    const rs=statsFor("right"), ls=statsFor("left");
    rMin.textContent=deg(rs?.min);rMax.textContent=deg(rs?.max);rAvg.textContent=deg(rs?.avg);rRange.textContent=deg(rs?.range);
    lMin.textContent=deg(ls?.min);lMax.textContent=deg(ls?.max);lAvg.textContent=deg(ls?.avg);lRange.textContent=deg(ls?.range);

    const mode=modeSelect.value;

    if(mode==="right"){
      if(!rs){summaryText.textContent="右腕の検出データが不足しています。";return}
      summaryText.textContent=`右腕単独解析：最小 ${rs.min.toFixed(1)}°、最大 ${rs.max.toFixed(1)}°、平均 ${rs.avg.toFixed(1)}°、可動幅 ${rs.range.toFixed(1)}°。`;
      return;
    }

    if(mode==="left"){
      if(!ls){summaryText.textContent="左腕の検出データが不足しています。";return}
      summaryText.textContent=`左腕単独解析：最小 ${ls.min.toFixed(1)}°、最大 ${ls.max.toFixed(1)}°、平均 ${ls.avg.toFixed(1)}°、可動幅 ${ls.range.toFixed(1)}°。`;
      return;
    }

    let dominant="判定不能";
    if(rightValidCount>leftValidCount*1.15)dominant="右腕";
    else if(leftValidCount>rightValidCount*1.15)dominant="左腕";
    else if(rightValidCount||leftValidCount)dominant="両腕ほぼ同等";

    if(dominant==="右腕" && rs){
      summaryText.textContent=`自動判定：右腕を主解析対象としました。右腕の最小 ${rs.min.toFixed(1)}°、最大 ${rs.max.toFixed(1)}°、平均 ${rs.avg.toFixed(1)}°、可動幅 ${rs.range.toFixed(1)}°。`;
      return;
    }
    if(dominant==="左腕" && ls){
      summaryText.textContent=`自動判定：左腕を主解析対象としました。左腕の最小 ${ls.min.toFixed(1)}°、最大 ${ls.max.toFixed(1)}°、平均 ${ls.avg.toFixed(1)}°、可動幅 ${ls.range.toFixed(1)}°。`;
      return;
    }
    if(rs&&ls){
      const avgDiff=Math.abs(rs.avg-ls.avg),rangeDiff=Math.abs(rs.range-ls.range);
      summaryText.textContent=`自動判定：両腕とも安定して検出されました。平均角度差 ${avgDiff.toFixed(1)}°、可動幅差 ${rangeDiff.toFixed(1)}°。`;
      return;
    }
    if(rs){
      summaryText.textContent=`自動判定：右腕のみ十分に検出されました。右腕の最小 ${rs.min.toFixed(1)}°、最大 ${rs.max.toFixed(1)}°、平均 ${rs.avg.toFixed(1)}°、可動幅 ${rs.range.toFixed(1)}°。`;
      return;
    }
    if(ls){
      summaryText.textContent=`自動判定：左腕のみ十分に検出されました。左腕の最小 ${ls.min.toFixed(1)}°、最大 ${ls.max.toFixed(1)}°、平均 ${ls.avg.toFixed(1)}°、可動幅 ${ls.range.toFixed(1)}°。`;
      return;
    }
    summaryText.textContent="検出データが不足しています。カメラ位置を調整して再記録してください。";
  }

  function resetStats(){
    rMin.textContent=rMax.textContent=rAvg.textContent=rRange.textContent="--°";
    lMin.textContent=lMax.textContent=lAvg.textContent=lRange.textContent="--°";
    summaryText.textContent="記録停止後に自動計算します。";
    durationPill.textContent="0.0 秒";
    rightValidCount=0;leftValidCount=0;
  }

  cameraBtn.onclick=startCamera;
  flipBtn.onclick=async()=>{
    facingMode=facingMode==="user"?"environment":"user";
    video.style.transform=facingMode==="user"?"scaleX(-1)":"none";
    await startCamera();
  };

  recordBtn.onclick=()=>{
    samples=[];recording=true;recordStart=performance.now();
    recordBtn.disabled=true;stopBtn.disabled=false;csvBtn.disabled=true;
    sampleCountEl.textContent="0 サンプル";resetStats();drawGraph();
  };

  stopBtn.onclick=()=>{
    recording=false;recordBtn.disabled=false;stopBtn.disabled=true;
    csvBtn.disabled=samples.length===0;setStatus("記録終了","ok");renderStats();drawGraph();
  };

  clearBtn.onclick=()=>{
    samples=[];sampleCountEl.textContent="0 サンプル";csvBtn.disabled=true;resetStats();drawGraph();
  };

  csvBtn.onclick=()=>{
    if(!samples.length)return;
    const rs=statsFor("right"),ls=statsFor("left");
    const rows=[
      "time_s,right_elbow_deg,left_elbow_deg",
      ...samples.map(s=>[
        s.t.toFixed(3),
        s.right==null?"":s.right.toFixed(2),
        s.left==null?"":s.left.toFixed(2)
      ].join(",")),
      "",
      "summary,value",
      "mode,"+modeSelect.value,
      "right_valid_count,"+rightValidCount,
      "left_valid_count,"+leftValidCount,
      "duration_s,"+(samples[samples.length-1]?.t||0).toFixed(3),
      "right_min_deg,"+(rs?.min?.toFixed(2)??""),
      "right_max_deg,"+(rs?.max?.toFixed(2)??""),
      "right_avg_deg,"+(rs?.avg?.toFixed(2)??""),
      "right_range_deg,"+(rs?.range?.toFixed(2)??""),
      "left_min_deg,"+(ls?.min?.toFixed(2)??""),
      "left_max_deg,"+(ls?.max?.toFixed(2)??""),
      "left_avg_deg,"+(ls?.avg?.toFixed(2)??""),
      "left_range_deg,"+(ls?.range?.toFixed(2)??"")
    ];
    const blob=new Blob([rows.join("\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="crawl_form_"+new Date().toISOString().replace(/[:.]/g,"-")+".csv";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };

  function drawGraph(){
    const rect=graph.getBoundingClientRect(),dpr=devicePixelRatio||1;
    graph.width=Math.max(1,Math.round(rect.width*dpr));
    graph.height=Math.max(1,Math.round(rect.height*dpr));
    gctx.setTransform(dpr,0,0,dpr,0,0);
    const w=rect.width,h=rect.height,p={l:42,r:12,t:12,b:28},iw=w-p.l-p.r,ih=h-p.t-p.b;
    gctx.clearRect(0,0,w,h);gctx.fillStyle="#081522";gctx.fillRect(0,0,w,h);
    gctx.strokeStyle="#27415b";gctx.fillStyle="#8ea4bc";gctx.font="11px system-ui";
    [0,45,90,135,180].forEach(v=>{
      const y=p.t+ih*(1-v/180);gctx.beginPath();gctx.moveTo(p.l,y);gctx.lineTo(w-p.r,y);gctx.stroke();gctx.fillText(v+"°",5,y+4);
    });
    if(!samples.length){
      gctx.fillStyle="#7890aa";gctx.font="14px system-ui";gctx.textAlign="center";
      gctx.fillText("記録するとここに角度変化が表示されます",w/2,h/2);gctx.textAlign="start";return;
    }
    const tmax=Math.max(.1,samples[samples.length-1].t);
    const plot=(key,color)=>{
      gctx.strokeStyle=color;gctx.lineWidth=2;gctx.beginPath();let started=false;
      for(const s of samples){
        const v=s[key];if(v==null)continue;
        const x=p.l+iw*(s.t/tmax),y=p.t+ih*(1-v/180);
        if(!started){gctx.moveTo(x,y);started=true}else gctx.lineTo(x,y);
      }
      gctx.stroke();
    };
    plot("right","#46b5ff");plot("left","#38d39f");
  }

  addEventListener("resize",drawGraph);
  resetStats();
  drawGraph();
})();
</script>
</body>
